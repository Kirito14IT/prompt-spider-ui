<svg xmlns="http://www.w3.org/2000/svg" class="ps-mark" viewBox="0 0 720 160" role="img" aria-labelledby="ps-logo-title ps-logo-desc">
  <title id="ps-logo-title">Prompt Spider UI</title>
  <desc id="ps-logo-desc">One large mechanical spider patrols across the center of the wordmark, carrying its orbital particles and pulsing energy field through a seamless twelve-second loop.</desc>
  <style>
    .ps-motion{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    .ps-travel{transform:translate(230px,80px);animation:ps-travel 12s linear infinite}
    .ps-facing{transform:rotate(90deg);animation:ps-facing 12s ease-in-out infinite}
    .ps-turn-fit{transform:scale(.98);animation:ps-turn-fit 12s linear infinite}
    .ps-bob{transform-origin:64px 64px;animation:ps-bob .6s ease-in-out infinite}
    .ps-leg{animation:ps-step .6s ease-in-out infinite}
    .ps-leg-right{animation-direction:reverse}
    .ps-core{transform-origin:64px 64px;animation:ps-heartbeat 1.5s ease-in-out infinite}
    .ps-aura{transform-origin:64px 64px;animation:ps-aura 1.5s ease-in-out infinite}
    .ps-energy-orbit{transform-origin:0 0;animation:ps-energy-orbit 6s linear infinite}
    .ps-energy-pulse{transform-origin:0 0;animation:ps-energy-pulse 1.5s ease-in-out infinite}
    .ps-energy-particles{animation:ps-energy-particles 3s ease-in-out infinite}
    .ps-mark[data-motion="paused"] .ps-motion{animation-play-state:paused}
    @keyframes ps-travel{0%,100%{transform:translate(230px,80px)}45%,50%{transform:translate(490px,80px)}95%{transform:translate(230px,80px)}}
    @keyframes ps-facing{0%,45%{transform:rotate(90deg)}50%,95%{transform:rotate(270deg)}100%{transform:rotate(450deg)}}
    @keyframes ps-turn-fit{0%,44%,51%,94%,100%{transform:scale(.98)}47.5%,97.5%{transform:scale(.84)}}
    @keyframes ps-step{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
    @keyframes ps-bob{0%,100%{transform:translate(0,0) rotate(-.7deg)}50%{transform:translate(0,-2px) rotate(.7deg)}}
    @keyframes ps-heartbeat{0%,48%,100%{transform:scale(1);fill:#f34a87}13%{transform:scale(1.13);fill:#ff87b4}26%{transform:scale(1.02);fill:#f34a87}35%{transform:scale(1.09);fill:#ff6da5}}
    @keyframes ps-aura{0%,48%,100%{transform:scale(.94);opacity:.18}13%{transform:scale(1.12);opacity:.48}35%{transform:scale(1.06);opacity:.36}}
    @keyframes ps-energy-orbit{to{transform:rotate(360deg)}}
    @keyframes ps-energy-pulse{0%,48%,100%{transform:scale(.94);opacity:.2}13%{transform:scale(1.025);opacity:.55}35%{transform:scale(.99);opacity:.38}}
    @keyframes ps-energy-particles{0%,100%{transform:translate(0,0);opacity:.4}50%{transform:translate(0,-4px);opacity:.85}}
    @media(prefers-reduced-motion:reduce){.ps-mark .ps-motion{animation:none!important}.ps-mark .ps-aura{opacity:.18}}
  </style>
  <rect width="720" height="160" fill="#090a0a"/>
  <g class="ps-wordmark" transform="translate(150 62) scale(3.5)" fill="none" stroke="#e5e6e7" stroke-width="1.35" stroke-linecap="square" stroke-linejoin="bevel">
    <path transform="translate(0 0)" d="M0 10V0H4.6L6 1.4V3.6L4.6 5H0"/>
    <path transform="translate(8 0)" d="M0 10V0H4.6L6 1.4V3.6L4.6 5H0M3.4 5 6 10"/>
    <path transform="translate(16 0)" d="M1.2 0H4.8L6 1.2V8.8L4.8 10H1.2L0 8.8V1.2Z"/>
    <path transform="translate(24 0)" d="M0 10V0L3 4.5L6 0V10"/>
    <path transform="translate(32 0)" d="M0 10V0H4.6L6 1.4V3.6L4.6 5H0"/>
    <path transform="translate(40 0)" d="M0 0H6M3 0V10"/>
    <path transform="translate(53 0)" d="M6 0H1.2L0 1.2V3.8L1.2 5H4.8L6 6.2V8.8L4.8 10H0"/>
    <path transform="translate(61 0)" d="M0 10V0H4.6L6 1.4V3.6L4.6 5H0"/>
    <path transform="translate(69 0)" d="M0 0H6M3 0V10M0 10H6"/>
    <path transform="translate(77 0)" d="M0 0H3.6L6 2.4V7.6L3.6 10H0Z"/>
    <path transform="translate(85 0)" d="M6 0H0V10H6M0 5H4.8"/>
    <path transform="translate(93 0)" d="M0 10V0H4.6L6 1.4V3.6L4.6 5H0M3.4 5 6 10"/>
    <path transform="translate(106 0)" d="M0 0V8.8L1.2 10H4.8L6 8.8V0"/>
    <path transform="translate(114 0)" d="M0 0H6M3 0V10M0 10H6"/>
  </g>
  <g class="ps-motion ps-travel" fill="#f34a87">
    <g class="ps-energy">
      <circle cx="0" cy="0" r="66" fill="none" stroke="#44d79c" stroke-width=".8" stroke-dasharray="2 9" opacity=".32"/>
      <path d="M-64-10A65 65 0 0 1-12-64M12 64A65 65 0 0 0 64 10" fill="none" stroke="#44d79c" stroke-width=".9" opacity=".4"/>
      <circle class="ps-motion ps-energy-pulse" cx="0" cy="0" r="58" fill="none" stroke="#f34a87" stroke-width="1.1" opacity=".2"/>
      <g class="ps-motion ps-energy-orbit"><circle cx="0" cy="-66" r="2.7" fill="#44d79c"/><circle cx="0" cy="66" r="2.2" fill="#f34a87"/><circle cx="0" cy="-66" r=".8" fill="#d3ffec"/></g>
      <g class="ps-motion ps-energy-particles"><rect x="-61" y="-40" width="3" height="3" fill="#44d79c"/><rect x="59" y="37" width="3" height="3" fill="#f34a87"/><circle cx="46" cy="-49" r="1.4" fill="#44d79c"/><circle cx="-46" cy="53" r="1.2" fill="#f34a87"/></g>
    </g>
    <g class="ps-motion ps-facing">
      <g class="ps-motion ps-turn-fit">
        <g transform="translate(-64 -64)">
          <g class="ps-motion ps-bob">
      <path d="M57 36V31L61 28M71 36V31L67 28" fill="none" stroke="#44d79c" stroke-width="2"/><circle cx="57" cy="34" r="2" fill="#eafff5"/><circle cx="71" cy="34" r="2" fill="#eafff5"/>
      <path class="ps-motion ps-aura" fill="none" stroke="#f34a87" stroke-width="1.5" d="M64 27 93 55V73L64 101 35 73V55Z"/>
      <g class="ps-motion ps-leg" style="transform-origin:52px 49px;animation-delay:0s"><path d="M52 49 38 35V25L27 12" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="27" cy="12" r="4.4" fill="#44d79c"/><circle cx="27" cy="12" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg" style="transform-origin:46px 58px;animation-delay:-0.075s"><path d="M46 58H36L24 46H9" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="9" cy="46" r="4.4" fill="#44d79c"/><circle cx="9" cy="46" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg" style="transform-origin:46px 70px;animation-delay:-0.15s"><path d="M46 70H36L24 82H9" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="9" cy="82" r="4.4" fill="#44d79c"/><circle cx="9" cy="82" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg" style="transform-origin:52px 79px;animation-delay:-0.225s"><path d="M52 79 38 93V103L27 116" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="27" cy="116" r="4.4" fill="#44d79c"/><circle cx="27" cy="116" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:76px 49px;animation-delay:0s"><path d="M76 49 90 35V25L101 12" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="101" cy="12" r="4.4" fill="#44d79c"/><circle cx="101" cy="12" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:82px 58px;animation-delay:-0.075s"><path d="M82 58H92L104 46H119" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="119" cy="46" r="4.4" fill="#44d79c"/><circle cx="119" cy="46" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:82px 70px;animation-delay:-0.15s"><path d="M82 70H92L104 82H119" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="119" cy="82" r="4.4" fill="#44d79c"/><circle cx="119" cy="82" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:76px 79px;animation-delay:-0.225s"><path d="M76 79 90 93V103L101 116" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="101" cy="116" r="4.4" fill="#44d79c"/><circle cx="101" cy="116" r="1.3" fill="#d3ffec"/></g>
      <path fill="none" stroke="#44d79c" stroke-width="1" opacity=".65" d="M64 31 88 55V73L64 97 40 73V55Z"/>
      <g class="ps-motion ps-core">
        <path fill="inherit" d="M64 37 84 57V71L64 91 44 71V57Z"/>
        <path fill="#090a0a" d="M60 53 48 64 60 75V67L56.5 64 60 61ZM68 53 80 64 68 75V67L71.5 64 68 61Z"/>
        <path fill="none" stroke="#ffbfd5" stroke-width="1.1" opacity=".8" d="M64 42 78 56M48 71 64 87"/>
      </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
