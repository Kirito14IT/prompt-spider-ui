<svg xmlns="http://www.w3.org/2000/svg" class="ps-mark" viewBox="0 0 160 160" role="img" aria-labelledby="ps-mark-title ps-mark-desc">
  <title id="ps-mark-title">Prompt Spider UI animated icon</title>
  <desc id="ps-mark-desc">Mint mechanical spider patrols up, right, down and left, with jointed legs and a pink double heartbeat.</desc>
  <style>
    .ps-motion{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    .ps-float{transform-origin:64px 64px;animation-name:ps-roam;animation-duration:6s}
    .ps-leg{animation-name:ps-step;animation-duration:1.5s}
    .ps-leg-right{animation-direction:reverse}
    .ps-core{transform-origin:64px 64px;animation-name:ps-heartbeat;animation-duration:1.5s}
    .ps-aura{transform-origin:64px 64px;animation-name:ps-aura;animation-duration:1.5s}
    .ps-orbit{transform-origin:64px 64px;animation-name:ps-orbit;animation-duration:6s;animation-timing-function:linear}
    .ps-packet{animation-name:ps-packet;animation-duration:6s}
    .ps-mark[data-motion="paused"] .ps-motion{animation-play-state:paused}
    @keyframes ps-roam{0%,100%{transform:translate(0,0) rotate(0deg)}16.6667%{transform:translate(0,-7px) rotate(-3deg)}33.3333%{transform:translate(8px,-2px) rotate(3deg)}50%{transform:translate(2px,7px) rotate(1deg)}66.6667%{transform:translate(-8px,3px) rotate(-3deg)}83.3333%{transform:translate(-4px,-5px) rotate(2deg)}}
    @keyframes ps-step{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
    @keyframes ps-heartbeat{0%,48%,100%{transform:scale(1);fill:#f34a87}13%{transform:scale(1.13);fill:#ff87b4}26%{transform:scale(1.02);fill:#f34a87}35%{transform:scale(1.09);fill:#ff6da5}}
    @keyframes ps-aura{0%,48%,100%{transform:scale(.94);opacity:.18}13%{transform:scale(1.12);opacity:.48}35%{transform:scale(1.06);opacity:.36}}
    @keyframes ps-orbit{to{transform:rotate(360deg)}}
    @keyframes ps-packet{0%,100%{opacity:.3}30%,60%{opacity:.85}}
    @media(prefers-reduced-motion:reduce){.ps-mark .ps-motion{animation:none!important}.ps-mark .ps-aura{opacity:.18}}
</style>
  <g transform="translate(16 16)" fill="#f34a87">
    <g fill="none" stroke="#44d79c" stroke-width=".8" opacity=".3">
      <circle cx="64" cy="64" r="61" stroke-dasharray="2 10"/>
      <path d="M4 63A60 60 0 0 1 40 9M88 119A60 60 0 0 0 123 65"/>
    </g>
    <g class="ps-motion ps-orbit" fill="#44d79c"><circle cx="64" cy="3" r="2.4"/><circle cx="64" cy="125" r="1.8"/></g>
    <g class="ps-motion ps-float">
      <path class="ps-motion ps-aura" fill="none" stroke="#f34a87" stroke-width="1.5" d="M64 27 93 55V73L64 101 35 73V55Z"/>
      <g class="ps-motion ps-leg" style="transform-origin:52px 49px;animation-delay:0s"><path d="M52 49 38 35V25L27 12" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="27" cy="12" r="4.4" fill="#44d79c"/><circle cx="27" cy="12" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg" style="transform-origin:46px 58px;animation-delay:-0.1875s"><path d="M46 58H36L24 46H9" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="9" cy="46" r="4.4" fill="#44d79c"/><circle cx="9" cy="46" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg" style="transform-origin:46px 70px;animation-delay:-0.375s"><path d="M46 70H36L24 82H9" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="9" cy="82" r="4.4" fill="#44d79c"/><circle cx="9" cy="82" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg" style="transform-origin:52px 79px;animation-delay:-0.5625s"><path d="M52 79 38 93V103L27 116" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="27" cy="116" r="4.4" fill="#44d79c"/><circle cx="27" cy="116" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:76px 49px;animation-delay:0s"><path d="M76 49 90 35V25L101 12" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="101" cy="12" r="4.4" fill="#44d79c"/><circle cx="101" cy="12" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:82px 58px;animation-delay:-0.1875s"><path d="M82 58H92L104 46H119" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="119" cy="46" r="4.4" fill="#44d79c"/><circle cx="119" cy="46" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:82px 70px;animation-delay:-0.375s"><path d="M82 70H92L104 82H119" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="119" cy="82" r="4.4" fill="#44d79c"/><circle cx="119" cy="82" r="1.3" fill="#d3ffec"/></g>
      <g class="ps-motion ps-leg ps-leg-right" style="transform-origin:76px 79px;animation-delay:-0.5625s"><path d="M76 79 90 93V103L101 116" fill="none" stroke="#44d79c" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="101" cy="116" r="4.4" fill="#44d79c"/><circle cx="101" cy="116" r="1.3" fill="#d3ffec"/></g>
      <path fill="none" stroke="#44d79c" stroke-width="1" opacity=".65" d="M64 31 88 55V73L64 97 40 73V55Z"/>
      <g class="ps-motion ps-core">
        <path fill="inherit" d="M64 37 84 57V71L64 91 44 71V57Z"/>
        <path fill="#090a0a" d="M60 53 48 64 60 75V67L56.5 64 60 61ZM68 53 80 64 68 75V67L71.5 64 68 61Z"/>
        <path fill="none" stroke="#ffbfd5" stroke-width="1.1" opacity=".8" d="M64 42 78 56M48 71 64 87"/>
      </g>
      <g class="ps-motion ps-packet" fill="#f34a87"><rect x="28" y="25" width="3" height="3"/><rect x="97" y="101" width="3" height="3"/></g>
    </g>
  </g>
</svg>
